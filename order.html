<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eats - Order</title>
    <link rel="stylesheet" href="css/style.css">

<body>

<header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="order.html">Order</a>
    </nav>
</header>

<main>
    <h2>Place Your Order</h2>

    <form>
        <label for="name">Name</label><br>
        <input type="text" id="name" placeholder="Enter your name"><br><br>

        <label for="phone">Phone Number</label><br>
        <input type="tel" id="phone" placeholder="Enter your phone number"><br><br>

        <label for="address">Delivery Location</label><br>
        <textarea id="address" rows="4" placeholder="Enter delivery location"></textarea><br><br>

        <button type="submit">Place Order</button>
    </form>
</main>

<script src="js/script.js"></script>

</body>
</html>
